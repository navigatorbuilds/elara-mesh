# elara-mcp — MCP server exposing Elara's mandate layer to MCP-speaking agents.
#
# Design + security decisions: docs/design-briefs/MCP-MANDATE-SERVER-VERDICT-2026-08-19.md
# (two-sided tool design; the agent key NEVER enters this process — act_emit
# shells out to `elara-cli agent-emit --json`; args are hashed server-side so
# a caller can never launder a pre-computed hash; issue/revoke have NO tool
# here and never will absent a forced-human-confirmation primitive in MCP).
#
# rmcp is EXACT-pinned: 3.x took a breaking major 2026-07-28; churn is a
# maintenance cost we take deliberately, one version at a time.
[package]
name = "elara-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "MCP server for Elara agent mandates: receipted acts, authority verdicts, offline mandate-bundle verification (post-quantum)."
repository = "https://github.com/navigatorbuilds/elara-mesh"
keywords = ["mcp", "ai-agents", "post-quantum", "audit", "provenance"]
categories = ["cryptography", "command-line-utilities"]

[dependencies]
rmcp = { version = "=3.1.3", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
sha3 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
elara-record = { path = "../elara-record", version = "0.2.0" }
elara-verify = { path = "../elara-verify", version = "0.3.0" }
