[package]
name = "elara-record"
version = "0.4.0"
edition = "2021"
# Manifest publish-READY (2026-07-11) — extraction complete, repo public. Actual
# publish = the E3 ceremony (order: elara-smt → elara-record → elara-verify; see
# docs/VERIFIER-EXTRACTION-AUDIT-2026-07-07.md), held ONLY on the operator's
# CARGO_REGISTRY_TOKEN. crates.io names are permanent.
# 0.1.1 (2026-07-24): description-only republish — name-collision disambiguator
# (unrelated "ELARA Protocol" suite + elara-math families exist on crates.io).
description = "Elara Protocol data layer: ValidationRecord, the byte-exact post-quantum wire codec, receipt types, hierarchical ZoneId, uuid7, and verify-side crypto primitives (Dilithium3 / SPHINCS+ verify, SHA3). The single source of truth for the wire format, shared by the AGPL node via re-export so node and standalone use never drift. Pure-Rust, wasm32-portable. Part of the navigatorbuilds Elara Protocol (post-quantum validation mesh, github.com/navigatorbuilds/elara-mesh); not affiliated with any other elara-* crates on crates.io."
license = "MIT OR Apache-2.0"
repository = "https://github.com/navigatorbuilds/elara-mesh"
readme = "README.md"
keywords = ["post-quantum", "wire-format", "validation", "verify", "dilithium"]
categories = ["data-structures", "encoding", "cryptography"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# Logging facade only (no subscriber): record.rs emits one diagnostic on the
# metadata-encode-overflow fallback path. Same non-optional posture as the node.
tracing = "0.1"
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"
sha3 = "0.10"
hex = "0.4"
uuid = { version = "1.0", features = ["v7", "js"] }
dilithium-rs = "=0.2.0"
# SPHINCS+ backend of the 0x02 second leg. 0.3.3 predates final FIPS 205 (its
# SHA2-192f H_msg diverges, tests/acvp_slhdsa192f.rs) and signed every 0x02 leg,
# so it stays, renamed, as that era's verifier.
slh_dsa_legacy = { package = "lattice-slh-dsa", version = "=0.3.3" }
# Final FIPS 205 SLH-DSA, the second leg from WIRE_VERSION 8 on. Nothing signs
# with it before the flag day; the ACVP tests pin it meanwhile.
slh_dsa = { package = "lattice-slh-dsa", version = "=0.4.0" }

# A second FIPS 205 implementation for the differential test of the v8 second
# leg (tests/slhdsa192f_differential.rs). Renamed because its library is also
# called `slh_dsa`. `signature` is pinned because slh-dsa 0.1.0 does not build
# against 2.3.0-pre.7. Test-only: nothing in the library links either crate.
[dev-dependencies]
rustcrypto_slh_dsa = { package = "slh-dsa", version = "=0.1.0" }
signature = "=2.3.0-pre.4"

# record::now_timestamp() reads the clock via js_sys::Date on wasm32 (no
# SystemTime there). Same pin as the node's wasm32 target block.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
